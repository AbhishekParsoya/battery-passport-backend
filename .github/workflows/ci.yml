name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, passport-service, document-service, notification-service]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🟢 Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install dependencies
        run: npm install

      - name: ✅ Lint
        run: npm run lint || echo "No lint script"

      - name: 🧪 Run Tests
        run: npm test || echo "No test script"
